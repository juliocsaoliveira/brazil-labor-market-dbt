version: 2

models:
  - name: dim_worker_profile
    description: >
      Mini-dimension combining education level, race/color, gender, and age bracket
      into a single dimension, keyed by a surrogate key. Grain: one row per distinct
      combination of these attributes that actually occurs in the CAGED data.
    columns:
      - name: worker_profile_key
        description: "Surrogate key, hash of education_level, race_color, gender, and age_bracket."
        data_tests:
          - not_null
          - unique

      - name: education_level
        description: "Worker's highest completed education level."

      - name: race_color
        description: "Worker's self-declared race/color, per IBGE/eSocial classification."

      - name: gender
        description: "Worker's gender as reported to eSocial."

      - name: age_bracket
        description: "Age bucketed into ranges: <18, then 5-year bands from 18-24 up to 60-64, then 65+."

  - name: dim_location
    description: >
      Location dimension collapsed to state + capital/interior indicator (no
      municipality-level granularity), to keep cardinality low while retaining
      a meaningful geographic signal.
    columns:
      - name: location_key
        description: "Surrogate key, hash of state_code and is_state_capital."
        data_tests:
          - not_null
          - unique

      - name: state_code
        description: "Two-letter state abbreviation."
        data_tests:
          - not_null

      - name: state_name
        description: "Full state name."

      - name: region_name
        description: "Brazilian macro-region (North, Northeast, etc.)."

      - name: is_state_capital
        description: "1 if this row represents the state capital, 0 otherwise."

  - name: dim_occupation
    description: >
      Occupation dimension based on the Brazilian Occupation Classification (CBO 2002),
      using the natural key directly since occupation_code is already unique and stable.
    columns:
      - name: occupation_code
        description: "CBO 2002 occupation code. Natural primary key."
        data_tests:
          - not_null
          - unique

      - name: occupation_name
        description: "Occupation name/description."
        data_tests:
          - not_null

      - name: major_group_name
        description: "Highest level of the occupation hierarchy."

  - name: dim_time
    description: >
      Time dimension at year-month grain, matching the reporting periodicity of CAGED.
    columns:
      - name: time_key
        description: "Surrogate key, hash of reference_year and reference_month."
        data_tests:
          - not_null
          - unique

      - name: reference_year
        description: "Reference year."
        data_tests:
          - not_null

      - name: reference_month
        description: "Reference month (1-12)."
        data_tests:
          - not_null

      - name: reference_date
        description: "First day of the reference month, as a DATE type, for easier time-series plotting."