version: 2

models:
  - name: stg_bd_directories__municipality
    description: "Reference dimension with Brazilian municipality attributes: name, state, and region hierarchy."
    columns:
      - name: municipality_id
        description: "IBGE 7-digit municipality code. Primary key."
        data_tests:
          - not_null
          - unique

      - name: municipality_name
        description: "Municipality name."
        data_tests:
          - not_null

      - name: state_code
        description: "Two-letter state abbreviation (e.g. SP, RJ)."
        data_tests:
          - not_null
  - name: stg_bd_directories__occupation
    description: "Reference dimension with the Brazilian Occupation Classification (CBO 2002) hierarchy."
    columns:
      - name: occupation_code
        description: "CBO 2002 occupation code. Primary key."
        data_tests:
          - not_null
          - unique

      - name: occupation_name
        description: "Occupation name/description."
        data_tests:
          - not_null

      - name: major_group_name
        description: "Highest level of the occupation hierarchy (e.g. 'Executivos, dirigentes...')."